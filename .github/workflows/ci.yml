# Builds and tests Ankabut on Windows, macOS and Linux on every push.
name: Build and test on Windows, macOS and Linux

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:developer
      - name: Install a headless browser for the smoke test
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install chromium
        shell: bash
      - name: Run the built app in a browser (English, French, Arabic, protected PDF)
        run: npm run smoke
